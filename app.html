<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工作台 · 考公学习系统</title>

<link rel="stylesheet" href="assets/system.css">
</head>
<body>
<div class="shell">

    <nav id="nav">

      <a class="nav-link" href="#xingce" data-view="xingce"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.2" y="3.2" width="13.6" height="13.6" rx="3"/><path d="M7 10.2l2.1 2.1L13.4 8"/></svg><span>行测刷题</span><i class="nav-short">行测</i></a>
      <a class="nav-link" href="#mock" data-view="mock"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><path d="M10 5.6V10l3.2 2"/></svg><span>模拟考试</span><i class="nav-short">模考</i></a>
      <a class="nav-link" href="#shenlun" data-view="shenlun"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 2.8h7l3.2 3.2v11.2H5z"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3"/></svg><span>申论批改</span><i class="nav-short">申论</i></a>
      <a class="nav-link" href="#koushu" data-view="koushu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5.5h14M3 10h9.5M3 14.5h12"/><path d="M15.2 12.4l2.2 2.2"/></svg><span>口语规范化</span><i class="nav-short">口语</i><em class="tag">核心</em></a>
      <a class="nav-link" href="#shizheng" data-view="shizheng"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><path d="M2.6 10h14.8M10 3c2 2.2 3 4.5 3 7s-1 4.8-3 7c-2-2.2-3-4.5-3-7s1-4.8 3-7z"/></svg><span>时政素材</span><i class="nav-short">时政</i></a>
      <a class="nav-link" href="#mianshi" data-view="mianshi"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h12v8.5H9.5L6 16v-3.5H4z"/><path d="M7.4 8.2h5.2"/></svg><span>面试陪练</span><i class="nav-short">面试</i></a>
      <a class="nav-link" href="#ciku" data-view="ciku"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 3.2h9.5L17 6.7v10.1H4z"/><path d="M13.5 3.2v3.5H17M7 11.5h6"/></svg><span>词库</span><i class="nav-short">词库</i></a>

    </nav>

    <div class="todaybox">
      <div class="row"><span>今日进度</span><b id="sideDone">0/5</b></div>
      <div class="mini-bar"><i id="sideBar" style="width:0%"></i></div>
      <div class="row"><span>连续学习</span><span id="sideStreak">第 1 天</span></div>
    </div>
    <a class="back" href="index.html">‹ 返回官网</a>
  </aside>

  <!-- ================= 主区 ================= -->
  <main class="main">
    <div class="topbar">
      <h1 id="pageTitle">今日</h1>
      <span class="sub" id="pageSub">今天该做什么，一次讲清</span>
      <div class="right">
        <button class="icobtn" id="searchBtn" title="全局搜索" aria-label="全局搜索">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.8" cy="8.8" r="5.4"/><path d="M13 13l4 4"/></svg>
        </button>
        <button class="icobtn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">
          <svg class="ic-moon" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7 7 0 1 0 9 9z"/></svg>
          <svg class="ic-sun" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.6v2.2M10 16.2v2.2M1.6 10h2.2M16.2 10h2.2M4.1 4.1l1.6 1.6M14.3 14.3l1.6 1.6M15.9 4.1l-1.6 1.6M5.7 14.3l-1.6 1.6"/></svg>
        </button>
      </div>
    </div>
    <div class="wrap">
      <div class="view" id="view"></div>
    </div>
  </main>
</div>

<div id="toast"></div>

<!-- 全局搜索 -->
<div class="gs-overlay" id="gsOverlay">
  <div class="gs-box">
    <div class="gs-head">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.8" cy="8.8" r="5.4"/><path d="M13 13l4 4"/></svg>
      <input id="gsInput" class="gs-input" type="text" placeholder="全局搜：题目 · 申论规范词 · 成语 · 时政素材…" autocomplete="off">
      <button class="icobtn" id="gsClose" title="关闭">✕</button>
    </div>
    <div class="gs-body" id="gsBody"></div>
    <div class="gs-tip" id="gsTip">输入关键词自动搜索，按 行测题目 / 申论题 / 时政素材 / 规范词 / 成语 / 实词 分组展示，点击结果直接跳转</div>
  </div>
</div>
